name: CI

# Documentation-only changes skip the run; macOS runners are the expensive ones.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build
      - run: swift test
